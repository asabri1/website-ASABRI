
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #123b70;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 65px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 5px 20px #00000012;
        }

        .app-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
        }

        .download-btn {
            display: block;
            margin-top: 25px;
            padding: 15px;
            background: #16834a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #116638;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>DOWNLOAD CENTER</h1>
        <p>Pusat Download Aplikasi</p>
    </header>

    <main class="container">

        <div class="app-icon">📱</div>

        <h2>Aplikasi Demo</h2>

        <p class="description">
            Ini adalah website latihan untuk belajar
            membuat halaman download aplikasi Android.
        </p>

        <a class="download-btn"
           href="demo.txt"
           download>
            ⬇ DOWNLOAD DEMO
        </a>

        <p class="description">
            File latihan: TXT • Aman untuk pengujian
        </p>

    </main>

    <footer>
        Website latihan pribadi
    </footer>

</body>
</html>
